openapi: 3.0.3
info:
  title: 影策 HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: models
  - name: agent
  - name: admin
paths:
  /resources/{id}/probe:
    post:
      tags: [resources]
      summary: 探测当前账号的音视频文件
      description: 本地 ffprobe 与 SHA-256，不调用模型。上限 512 MiB、六小时、每进程两个并发；要求归属、就绪状态并限流。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 标准信封中的 data 为探测结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      digest: { type: string, description: 文件 SHA-256 }
                      durationMs: { type: integer, format: int64 }
                      startTime: { type: string }
                      streams:
                        type: array
                        items:
                          type: object
                          properties:
                            index: { type: integer }
                            codec_type: { type: string }
                            codec_name: { type: string }
                            time_base: { type: string }
                            avg_frame_rate: { type: string }
                            sample_rate: { type: string }
                            channels: { type: integer }
        '400': { description: 文件无效、超限、工具不可用或处理繁忙 }
        '401': { description: 未登录 }
        '429': { description: 超过媒体请求频率 }
  /resources/{id}/frame:
    get:
      tags: [resources]
      summary: 按播放时间提取当前账号视频的预览帧
      description: 返回最长边 640 的 JPEG，Cache-Control 为 private/no-store。atMs 是请求时间，不声明精确解码 PTS。权限与资源探测相同。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: atMs
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: JPEG 二进制（不使用 JSON 信封）
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { description: 时间越界、媒体无效或工具不可用 }
        '401': { description: 未登录 }
        '429': { description: 超过媒体请求频率 }
  /business-objects:
    get:
      tags: [assets]
      summary: 检索当前账号的品牌对象
      description: 仅品牌文本对象；每页最多 30 项，按最近更新排序。返回对象索引数组（objectId/type/title/version/archived/createdAt/updatedAt），不含用户 ID。private/no-store。
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: archived, in: query, schema: {type: boolean, default: false}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000, default: 0}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [assets]
      summary: 明确保存品牌新版本
      description: 最多 32 KiB；品牌内容最多 16 KiB。新建 expectedVersion=0，不带 objectId；修改必须带当前 objectId 和预期版本。clientKey 在对象内绑定原始正文，网络失败应原样重试。每账号最多 100 个对象（含归档）、每对象最多 100 版。返回 BusinessObjectView 信封。此为用户直接管理入口，插件必须走 object.save 宿主审批。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BusinessObjectWrite"}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /business-objects/{id}/versions/{version}:
    get:
      tags: [assets]
      summary: 读取当前账号品牌的固定版本（包括归档历史）
      description: 返回 BusinessObjectView 信封；版本内容不可变，archived/currentVersion 为当前索引信息。private/no-store。不存在和非当前账号统一返回 404。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /business-objects/{id}/archive:
    patch:
      tags: [assets]
      summary: 归档或恢复品牌，不删除历史
      description: 最多 1 KiB。按当前版本校验；归档是幂等状态设置，不创建内容版本。归档阻止新插件读取/工作台调用，历史任务输入保留；响应 data 为 archived 布尔值对象。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, archived]
              properties:
                expectedVersion: {type: integer, minimum: 1, maximum: 100}
                archived: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /plugin-workbenches:
    get:
      tags: [agent]
      summary: 当前账号已启用插件贡献的工作台目录
      description: 返回 id、releaseId、version、definition；目录可见不等于当前入口已获准执行。private/no-store。
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "403": {$ref: "#/components/responses/Error"}
  /plugin-workbenches/{id}:
    get:
      tags: [agent]
      summary: 读取指定版本工作台、配方和输入 Schema
      description: 校验用户启用版本、插件状态、操作授权、hostSurface 和画布归属。返回 definition、recipes、schema、schemas、可选 skillId。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, description: "pluginId.workbenchId"}
        - {name: releaseId, in: query, schema: {type: string}}
        - {name: hostSurface, in: query, required: true, schema: {type: string, enum: [agent-home, canvas]}}
        - {name: canvasId, in: query, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /plugin-workbench-previews:
    post:
      tags: [agent]
      summary: 合并工作台和配方，预览最终输入
      description: 最多 64 KiB。返回 input、prompts、conflicts、valid、selection 、可选 validationMessage 和 objects（按 objectInputs 解析的当前账号固定版本事实；引用不兼容/已归档/未授权则失败）。业务冲突或字段缺失时 valid=false；只有有效预览可交给插件操作或 Agent。预览不执行操作、不选择模型、不授权、不收费。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, releaseId, recipeIds, input, context]
              properties:
                id: {type: string}
                releaseId: {type: string}
                recipeIds: {type: array, maxItems: 16, uniqueItems: true, items: {type: string}}
                input: {type: object, maxProperties: 32}
                context:
                  type: object
                  additionalProperties: false
                  required: [hostSurface]
                  properties:
                    hostSurface: {type: string, enum: [agent-home, canvas]}
                    canvasId: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /plugins:
    post:
      tags: [admin]
      summary: 管理员安装插件包，按 apiVersion 分流
      description: v1/v2 保持旧协议注册表；v3 登记不可变发布与包内技能。相同 ID/version 不同内容返回 409。P01 不开放操作执行。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /plugins/applications:
    get:
      tags: [agent]
      summary: 当前用户的应用插件版本、技能和操作目录
      description: data.applications 包含发布快照与当前用户启用/授权状态；操作 available 在 P01 始终为 false。管理员还可查看已卸载的历史登记。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /plugins/applications/{id}/activation:
    put:
      tags: [agent]
      summary: 按修订号选择发布版本与权限并启用或停用
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releaseId, enabled, grantedPermissions, revision]
              properties:
                releaseId: {type: string}
                enabled: {type: boolean}
                grantedPermissions: {type: array, items: {type: string}}
                revision: {type: integer, minimum: 0}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/plugins/applications/{id}:
    put:
      tags: [admin]
      summary: 管理员开放、停用、撤回版本或卸载应用
      description: 卸载保留历史；revoke 不可恢复，需发布新版本；availability=true 要求先安装。revision 使用应用平台修订号。
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, revision]
              properties:
                action: {type: string, enum: [availability, uninstall, revoke]}
                available: {type: boolean}
                releaseId: {type: string}
                revision: {type: integer, minimum: 1}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/plugins/applications/orphans/preview:
    post:
      tags: [admin]
      summary: 预览超过 24 小时且未被发布引用的应用归档
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /admin/plugins/applications/orphans/prune:
    post:
      tags: [admin]
      summary: 清理超过 24 小时且未被发布引用的应用归档
      description: 不删除被历史或已卸载版本引用的文件；物理删除不可恢复，建议先调用 preview。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /plugin-canvases/{id}/snapshot:
    get:
      tags: [agent]
      summary: 读取当前用户画布的插件写入快照标识
      description: 返回 canvasId 和 snapshotHash；不包含画布内容，也不授权写入。蓝图实例化仍走 plugin-invocations 和用户审批。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /plugin-connections:
    get:
      tags: [agent]
      summary: 当前用户的加密连接配置（仅返回是否已配置凭据）
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
    put:
      tags: [agent]
      summary: 保存用户连接的新修订，旧任务继续使用旧修订
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, connectorId, baseUrl, enabled, revision]
              additionalProperties: false
              properties:
                pluginId: {type: string}
                connectorId: {type: string}
                name: {type: string, maxLength: 120}
                baseUrl: {type: string, maxLength: 4096}
                credential: {type: string, maxLength: 8192, writeOnly: true}
                enabled: {type: boolean}
                revision: {type: integer, minimum: 0}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "409":
          $ref: "#/components/responses/Error"
  /admin/plugin-operation-prices/{releaseId}/{operationId}:
    get:
      tags: [agent]
      summary: 管理员读取插件平台服务费
      parameters:
        - {name: releaseId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
  /admin/plugin-operation-prices:
    put:
      tags: [agent]
      summary: 管理员设置按成功结果结算的固定平台服务费
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releaseId, operationId, feeMicrocredits, revision]
              additionalProperties: false
              properties:
                releaseId: {type: string}
                operationId: {type: string}
                feeMicrocredits: {type: integer, minimum: 0, maximum: 1000000000}
                revision: {type: integer, minimum: 0}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-runs/{id}/resume:
    post:
      tags: [agent]
      summary: 恢复已批准的原插件任务，不绕过报价新建生成
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, action]
              additionalProperties: false
              properties:
                revision: {type: integer}
                action: {type: string, enum: [retry_safe, attach_job, retry_import, retry_poll]}
                providerJobId: {type: string, maxLength: 160}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-operations:
    get:
      tags: [agent]
      summary: 检索当前用户已启用且获准的插件操作
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}}
        - {name: hostSurface, in: query, schema: {type: string, enum: [agent-home, canvas, editor]}}
        - {name: canvasId, in: query, schema: {type: string}}
        - {name: projectId, in: query, schema: {type: string}}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
  /plugin-operations/{pluginId}/{operationId}:
    get:
      tags: [agent]
      summary: 读取固定发布版本的操作及输入输出 Schema
      parameters:
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string}}
        - {name: releaseId, in: query, required: true, schema: {type: string}}
        - {name: hostSurface, in: query, schema: {type: string, enum: [agent-home, canvas, editor]}}
        - {name: canvasId, in: query, schema: {type: string}}
        - {name: projectId, in: query, schema: {type: string}}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-invocations:
    post:
      tags: [agent]
      summary: 调用已启用插件操作
      description: 纯读取同步返回 inline；持久写操作必须带 Idempotency-Key，返回 waiting_approval 的 PluginRun，不由 Agent 自批。
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, minLength: 8, maxLength: 160}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, releaseId, input]
              additionalProperties: false
              properties:
                operation: {type: string}
                releaseId: {type: string}
                input: {type: object}
                workbench: {$ref: "#/components/schemas/WorkbenchSelection"}
                context:
                  type: object
                  additionalProperties: false
                  properties:
                    hostSurface: {type: string, enum: [agent-home, canvas, editor]}
                    canvasId: {type: string}
                    projectId: {type: string}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-runs:
    get:
      tags: [agent]
      summary: 当前用户的根运行历史，每页 30 条
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 10000}}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /plugin-runs/{id}/inputs/{inputId}:
    put:
      tags: [agent]
      summary: 保存输入草稿或提交完整输入
      description: 运行卡片及 plugin-input 画布节点共用此接口，runId/inputId 必须匹配当前用户的持久输入请求。草稿不推进流程；submit 必须符合固定 Schema。同键同值重放成功，同键异值或过期 revision 返回 409。提交不代表收费审批；删除画布节点不取消输入或运行。
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
        - {name: inputId, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, description: submit 时必需, schema: {type: string, minLength: 8, maxLength: 160}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, mode, value]
              additionalProperties: false
              properties:
                revision: {type: integer, minimum: 1}
                mode: {type: string, enum: [draft, submit]}
                value: {}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-batch-diagnostics:
    get:
      tags: [agent]
      summary: 当前用户的排队、活动槽、未知提交、导入积压和预算冲突计数
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /plugin-runs/{id}/batch-quote:
    get:
      tags: [agent]
      summary: 读取当前已展开远程任务的精确批次报价
      description: 返回任务清单、作用域摘要、平台微积分总额、供应商费用是否已知和五分钟有效期。不授权未展开的未来任务。
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-runs/{id}/batch-approval:
    post:
      tags: [agent]
      summary: 批准精确任务清单并原子预留平台费用
      description: 绑定发布、合同、所有输入（含模型参数）、连接、资源摘要、任务数量、总额和有效期。任一项变化、余额不足或 Agent 预算不足，整批回滚；重复批准不重复预留。供应商 BYOK 金额未知，必须单独接受，不受平台微积分额度覆盖。
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digest, count, amountMicrocredits, expiresAt, acceptExternalBilling]
              properties:
                digest: {type: string}
                count: {type: integer, minimum: 1, maximum: 8}
                amountMicrocredits: {type: integer, minimum: 0}
                expiresAt: {type: string, format: date-time}
                acceptExternalBilling: {type: boolean}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-runs/{id}/derive:
    post:
      tags: [agent]
      summary: 从已结束流程创建派生运行，不覆盖历史
      description: 只允许已结束且没有未决外部提交的流程；input 可替换入口输入，inputs 按 wait_input 步骤键覆盖表单。forceSteps 计算依赖闭包；reuseCompleted 默认 false，明确选择后仅复用输入、版本和资源摘要匹配的远程成功结果。新任务需重新批准。
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 160}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                input: {type: object, additionalProperties: true}
                inputs: {type: object, additionalProperties: true}
                forceSteps: {type: array, items: {type: string}}
                reuseCompleted: {type: boolean, default: false}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-runs/{id}/events:
    get:
      tags: [agent]
      summary: 插件运行 SSE 状态事件与断线重放
      description: event 为 plugin-run，id 为单运行 sequence。Last-Event-ID 优先于 after；超前游标返回 409。连接最多 25 秒，重连后刷新权威快照。
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
        - {name: after, in: query, schema: {type: integer, minimum: 0}}
        - {name: Last-Event-ID, in: header, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: 状态通知，不包含凭据或表单正文
          content:
            text/event-stream:
              schema: {type: string}
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-runs/{id}:
    get:
      tags: [agent]
      summary: 读取当前用户的单步或流程运行
      description: 包含固定发布版本、声明式 view、可选 canvasActions 和 projectionStatus/failureMessage。P07 的 pipeline.inputs[].view 描述输入组件；canvasActions 的 inputRequestId 表示待输入投影，否则表示成功结果投影。组件限 key-value/v1、table/v1、entity-cards/v1、mapping-editor/v1、media-compare/v1，集合视图可用 collectionPath，fields 为 JSON Pointer/label。投影需要 canvas.blueprint.instantiate 的既有审批，输入和结果来源互斥，同次节点与连线合计最多 20 项。历史读取不授予新调用权限。
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
        - {name: viewId, in: query, schema: {type: string}, description: 固定发布中的视图 ID；需与结果 Schema 匹配}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "404":
          $ref: "#/components/responses/Error"
  /plugin-runs/{id}/approvals/{approvalId}:
    post:
      tags: [agent]
      summary: 用户批准或拒绝持久插件操作
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
        - {name: approvalId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, revision]
              additionalProperties: false
              properties:
                decision: {type: string, enum: [approve, reject]}
                revision: {type: integer, minimum: 1}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "409":
          $ref: "#/components/responses/Error"
  /plugin-runs/{id}/cancel:
    post:
      tags: [agent]
      summary: 取消当前用户仍在等待确认的插件运行
      parameters:
        - $ref: "#/components/parameters/AgentRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              additionalProperties: false
              properties:
                revision: {type: integer, minimum: 1}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "409":
          $ref: "#/components/responses/Error"
  /tools:
    get:
      tags: [canvas]
      summary: 列出可见且启用的生成工具
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [public, favorites, custom], default: public}}
        - {in: query, name: type, schema: {type: string, enum: [style, motion, nine_grid, effect]}}
        - {in: query, name: tag, schema: {type: string}}
        - {in: query, name: search, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 80, default: 20}}
      responses:
        "200": {description: "标准信封 data 为 tools（摘要不含 prompt/extraInfo）、totalCount、page、pageSize、hasMore"}
        "401": {description: 未登录}
    post:
      tags: [canvas]
      summary: 创建当前用户的工具
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolMutation'}
      responses:
        "200": {description: 标准信封 data 为完整工具}
        "400": {description: 参数无效或预览资源不符合要求}
        "401": {description: 未登录}
  /tools/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      tags: [canvas]
      summary: 查询可见且启用工具的完整详情
      responses:
        "200": {description: 标准信封 data 为完整工具，包含 prompt 和 extraInfo}
        "404": {description: 工具不存在或不可见}
    delete:
      tags: [canvas]
      summary: 删除自己的用户工具及关联收藏，不删除预览文件
      responses:
        "200": {description: "标准信封 data 为 {deleted: true}"}
        "404": {description: 工具不存在或不能删除}
  /tools/{id}/favorite:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      tags: [canvas]
      summary: 幂等收藏可见工具
      responses:
        "200": {description: 标准信封 data 为完整工具和收藏状态}
        "404": {description: 工具不存在或不可见}
    delete:
      tags: [canvas]
      summary: 幂等取消收藏可见工具
      responses:
        "200": {description: 标准信封 data 为完整工具和收藏状态}
        "404": {description: 工具不存在或不可见}
  /model-catalog:
    get:
      tags: [models]
      summary: 获取创作端模型目录
      description: |
        固定 source=system，channels 直接来自系统渠道下的模型列表，models 为空数组；不反查逻辑模型。
        一级跨渠道按 displayName 分组，二级显示 channelLabel；模型请求仍使用 channelId + modelKey 定位。
        channelLabel 是后台渠道模型创建和更新时配置的渠道展示名，去除首尾空白后最多 80 字，空字符串表示使用所属渠道名称。
        description 是后台渠道模型创建和更新时填写的公开模型描述，去除首尾空白后最多 500 字；空字符串表示未填写。
        displayName 和 icon 用于一级模型菜单，channelLabel 不参与路由、权限或计费。
        渠道级 publicAlias 已废弃；成本配置和成本快照仅供管理端，不包含在本接口及用户报价中。
      responses:
        "200":
          description: 当前启用的模型目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum: [0]
                  msg:
                    type: string
                  data:
                    type: object
                    required: [source, models, channels]
                    properties:
                      source:
                        type: string
                        enum: [system]
                      models:
                        type: array
                        items:
                          type: object
                      channels:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            displayName:
                              type: string
                            models:
                              type: array
                              items:
                                type: object
                                properties:
                                  modelKey:
                                    type: string
                                  displayName:
                                    type: string
                                  icon:
                                    type: string
                                  channelLabel:
                                    type: string
                                    maxLength: 80
                                    default: ""
                                  description:
                                    type: string
                                    maxLength: 500
                                    default: ""
        "401":
          $ref: "#/components/responses/Error"
  /model-catalog/quote:
    post:
      tags: [models]
      summary: 按当前参数预估系统渠道模型费用
      description: |
        需要登录会话 Cookie。仅接受启用的系统渠道和模型，采用服务端能力默认值及价格档选择规则。
        不创建任务或账单、不冻结或扣除积分，也不调用模型供应商。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, modelKey, intent]
              properties:
                channelId:
                  type: string
                  minLength: 1
                modelKey:
                  type: string
                  minLength: 1
                  description: 系统渠道中配置的模型键
                intent:
                  $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /models/{id}/quote:
    post:
      tags: [models]
      summary: 按当前参数预估前台模型费用
      description: |
        需要登录会话 Cookie。请求正文直接为创作意图，不使用 intent 外层包装。
        服务端按前台模型能力、默认参数、供应线路和价格策略报价，不创建任务、账单或积分冻结。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: 前台逻辑模型 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "404":
          description: 画布不存在或不属于当前用户
    put:
      tags: [canvas]
      summary: 按 revision 保存画布内容
      description: 新建传 revision 0，更新传读取到的版本；成功原子加 1。忽略客户端 viewport 和 remoteContentHash，updatedAt 由服务端生成。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: object
                  required: [id, revision]
                  properties:
                    id: { type: string }
                    revision: { type: integer, format: int64, minimum: 0 }
                  additionalProperties: true
      responses:
        "200":
          description: 信封 data.project 返回摘要及递增后的 revision
        "400":
          description: 请求、版本或素材引用不合法
        "409":
          description: 版本或资源状态冲突，原内容未被覆盖；保留草稿后加载最新版
        "428":
          description: 缺少 revision，需刷新客户端并重新读取
  /canvas-projects/{id}/history:
    get:
      tags: [canvas]
      summary: 读取当前画布版本与最近 20 份历史摘要
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 currentRevision 和 snapshots；每项含 id、revision、title、nodeCount、connectionCount、payloadBytes、reason、contentUpdatedAt、createdAt，不含正文
        "404":
          description: 画布不存在或无权访问
  /canvas-projects/{id}/history/{snapshotId}:
    get:
      tags: [canvas]
      summary: 按需读取历史正文
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 snapshot 摘要和 project 正文
        "404":
          description: 画布或快照不存在、已过期或无权访问
  /canvas-projects/{id}/history/{snapshotId}/restore:
    post:
      tags: [canvas]
      summary: 备份当前内容并将历史内容恢复为新版本
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: 信封 data.project 返回恢复后的摘要及新 revision；当前 ID、归属与项目关联保留
        "404":
          description: 画布或快照不存在、已过期或无权访问
        "409":
          description: 当前版本或素材状态已变化，恢复未执行
        "428":
          description: 缺少当前 revision
  /public/welcome:
    get:
      tags: [meta]
      security: []
      summary: 读取欢迎页开放状态
      responses:
        "200":
          description: 信封 data 仅包含 welcomeEnabled 布尔值，默认 true；Cache-Control 为 no-store
        "500":
          description: 配置读取失败
  /agent/capabilities:
    get:
      tags: [agent]
      summary: 读取云端 Agent 能力
      responses:
        "200":
          description: 信封 data 包含 version、permissionModes、contextScopes、skills、writeTools、billing、maxHistoryPairs、maxSteps、maxHistoryBytes、capabilitySetVersion、capabilitySetHash、nodeTypes、tools；maxHistoryPairs 为跨轮保留的用户对话轮数，maxSteps 为 0 表示无固定模型调用上限，历史仍受 maxHistoryBytes 限制
  /agent/profile:
    get:
      tags: [agent]
      summary: 读取生效的用户、项目、画布 Agent 偏好层
      parameters:
        - in: query
          name: scope
          schema:
            type: string
            enum: [user, project, canvas]
        - in: query
          name: projectId
          schema:
            type: string
        - in: query
          name: canvasId
          schema:
            type: string
      responses:
        "200":
          description: 信封 data 为合并 revision、hash 和按 user/project/canvas 顺序排列的 layers；每层含独立数字 revision
        "403":
          description: 项目或画布不属于当前用户
    patch:
      tags: [agent]
      summary: 使用单层 revision CAS 更新 Agent 偏好
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileRequest"
      responses:
        "200":
          description: 返回更新后的生效偏好视图
        "409":
          description: 偏好 revision 已变化，须重新读取后保存
  /agent/memories:
